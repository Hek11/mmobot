<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Throne and Liberty — Eventos Gamer</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --panel-bg: #181c24;
      --accent: #d4af37;
      --accent-hover: #f3c643;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #2a3241;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: var(--accent);
      text-align: center;
      margin-bottom: 40px;
    }

    /* Estilos del Asistente Flotante */
    .ai-assistant-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      font-family: inherit;
    }

    .ai-btn {
      background: linear-gradient(135deg, var(--accent), #aa8c2c);
      color: #000;
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .ai-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, var(--accent-hover), var(--accent));
    }

    .ai-panel {
      position: absolute;
      bottom: 70px;
      right: 0;
      width: 320px;
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }

    .ai-panel.open {
      display: flex;
    }

    .ai-header {
      background: #11141b;
      padding: 15px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ai-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ai-body input {
      background-color: #0f1115;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .ai-body input:focus {
      border-color: var(--accent);
    }

    .ai-body button {
      background-color: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .ai-body button:hover {
      background-color: var(--accent-hover);
    }

    .ai-response {
      background-color: #0f1115;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      color: var(--text-muted);
      max-height: 150px;
      overflow-y: auto;
      display: none;
      white-space: pre-wrap;
    }

    .ai-response.show {
      display: block;
      color: var(--text-main);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>Throne and Liberty — Eventos Gamer</h1>
  <p style="text-align: center; color: var(--text-muted);">Bienvenido a la plataforma de gestión de eventos. Usa el asistente abajo a la derecha para consultar dudas sobre el juego.</p>

  <!-- Componente del Asistente Gemini -->
  <div class="ai-assistant-container">
    <button class="ai-btn" id="aiBtn">
      ✨ Asistente IA
    </button>
    <div class="ai-panel" id="aiPanel">
      <div class="ai-header">
        <span>Guía de Throne and Liberty</span>
      </div>
      <div class="ai-body">
        <input type="text" id="aiQ" placeholder="Ej: ¿Dónde aparece Teventa?" />
        <button id="aiAsk">Preguntar</button>
        <div class="ai-response" id="aiA"></div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const btn = document.getElementById('aiBtn');
      const panel = document.getElementById('aiPanel');
      const q = document.getElementById('aiQ');
      const ask = document.getElementById('aiAsk');
      const a = document.getElementById('aiA');

      // Alternar apertura del panel
      btn.onclick = () => {
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) q.focus();
      };

      // Manejar la consulta a la API de Gemini
      ask.onclick = async () => {
        const pregunta = q.value.trim();
        if (!pregunta) return;

        a.textContent = "Consultando con la IA...";
        a.classList.add('show');
        ask.disabled = true;

        try {
          // Reemplaza 'TU_API_KEY' con tu clave real obtenida de Google AI Studio
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=TU_API_KEY`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: "Actúa como un experto y wiki oficial del MMORPG Throne and Liberty. Responde de forma clara, útil y breve en español a la siguiente duda: " + pregunta }]
              }]
            })
          });

          const data = await response.json();
          const respuestaTexto = data.candidates?.[0]?.content?.parts?.[0]?.text || "No se pudo obtener una respuesta en este momento.";
          
          a.textContent = respuestaTexto;
        } catch (error) {
          console.error(error);
          a.textContent = "Ocurrió un error al conectar con el servidor de IA.";
        } finally {
          ask.disabled = false;
        }
      };

      // Enviar con la tecla Enter
      q.onkeydown = e => { 
        if (e.key === 'Enter') ask.click(); 
      };
    })();
  </script>

</body>
</html>
