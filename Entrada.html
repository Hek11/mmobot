<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Juegos - Eventos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap');

:root{
  --bg-dark: #070913;
  --bg-card: #0c1021;
  --sidebar-width: 90px;
  --neon-cyan: #00f3ff;
  --neon-purple: #b026ff;
  --neon-pink: #ff007f;
  --text-main: #e2e8f0;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width: 100%;
  height: 100vh;
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: 'Rajdhani', sans-serif;
  overflow: hidden;
}

/* CONTENEDOR GENERAL */
.app-container {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  grid-template-rows: 75px 1fr;
  height: 100vh;
  width: 100vw;
}

/* =========================================================
   HEADER SUPERIOR
   ========================================================= */
.top-header {
  grid-column: 1 / 3;
  grid-row: 1 / 2;
  background: linear-gradient(90deg, rgba(12,16,33,0.95) 0%, rgba(6,9,20,0.98) 100%);
  border-bottom: 2px solid rgba(0, 243, 255, 0.25);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 35px;
  z-index: 100;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  position: relative;
}

.top-header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), transparent);
}

.header-left-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 10px rgba(0,243,255,0.3));
}

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.live-clock {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--neon-cyan);
  background: rgba(0, 243, 255, 0.05);
  border: 1px solid rgba(0, 243, 255, 0.3);
  padding: 8px 16px;
  border-radius: 6px;
  box-shadow: inset 0 0 10px rgba(0,243,255,0.15);
}

.user-logout-btn {
  background: linear-gradient(135deg, rgba(176,38,255,0.2), rgba(0,243,255,0.2));
  border: 1px solid rgba(0, 243, 255, 0.5);
  color: #fff;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  padding: 9px 18px;
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(0,243,255,0.2);
  transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.user-logout-btn:hover {
  background: linear-gradient(135deg, rgba(176,38,255,0.4), rgba(0,243,255,0.4));
  border-color: #fff;
  box-shadow: 0 0 20px var(--neon-cyan), 0 0 30px var(--neon-purple);
  transform: translateY(-2px);
}

/* =========================================================
   MENÚ LATERAL
   ========================================================= */
.sidebar {
  grid-column: 1 / 2;
  grid-row: 2 / 3;
  background: #04060e;
  border-right: 2px solid rgba(0, 243, 255, 0.15);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 25px 0;
  z-index: 110;
  box-shadow: 8px 0 30px rgba(0,0,0,0.9);
}

.sidebar-menu {
  display: flex;
  flex-direction: column;
  gap: 20px;
  list-style: none;
  padding: 0;
  margin: 0;
  width: 100%;
  align-items: center;
}

/* BOTÓN DE ICONO CON TOOLTIP */
.menu-icon-btn {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(176, 38, 255, 0.15));
  border: 1px solid var(--neon-cyan);
  border-radius: 12px;
  color: var(--neon-cyan);
  cursor: pointer;
  box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.3), 0 0 20px rgba(0, 243, 255, 0.3);
  text-decoration: none;
  transition: all 0.3s ease;
}

.menu-icon-btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
  filter: drop-shadow(0 0 10px var(--neon-cyan));
}

/* ESTILOS ESPECÍFICOS PARA DISCORD EN LA SIDEBAR */
.menu-icon-btn.discord-btn {
  background: linear-gradient(135deg, rgba(88, 101, 242, 0.3), rgba(0, 243, 255, 0.15));
  border-color: #5865F2;
  color: #5865F2;
  box-shadow: inset 0 0 15px rgba(88, 101, 242, 0.3), 0 0 20px rgba(88, 101, 242, 0.3);
}

.menu-icon-btn.discord-btn svg {
  fill: #5865F2;
  filter: drop-shadow(0 0 10px #5865F2);
}

.menu-icon-btn.discord-btn:hover {
  background: linear-gradient(135deg, rgba(88, 101, 242, 0.5), rgba(0, 243, 255, 0.3));
  border-color: #fff;
  color: #fff;
  box-shadow: 0 0 25px #5865F2;
}

.menu-icon-btn.discord-btn::after {
  color: #5865F2;
  border-color: rgba(88, 101, 242, 0.4);
}

/* TOOLTIP FLOTANTE NEÓN */
.menu-icon-btn::after {
  content: attr(data-tooltip);
  position: absolute;
  left: 75px;
  background: rgba(7, 9, 19, 0.95);
  color: var(--neon-cyan);
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid rgba(0, 243, 255, 0.4);
  white-space: nowrap;
  box-shadow: 0 5px 20px rgba(0,0,0,0.8), 0 0 10px rgba(0,243,255,0.2);
  opacity: 0;
  visibility: hidden;
  transform: translateX(-10px);
  transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
  pointer-events: none;
  z-index: 150;
}

.menu-icon-btn:hover::after {
  opacity: 1;
  visibility: visible;
  transform: translateX(0);
}

/* =========================================================
   CONTENEDOR PRINCIPAL Y VISTAS
   ========================================================= */
.main-content {
  grid-column: 2 / 3;
  grid-row: 2 / 3;
  position: relative;
  overflow-y: auto;
  padding: 35px;
  background: radial-gradient(circle at 50% 20%, #0d1229 0%, #060914 100%);
}

.view-section {
  display: block;
  animation: fadeIn 0.4s ease-in-out forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* GRID DE JUEGOS */
.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 30px;
}

/* TARJETA DE JUEGO HUD */
.game-card {
  position: relative;
  width: 100%;
  height: 250px;
  padding: 20px;
  text-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
  background-size: cover;
  background-position: center;
  border-radius: 12px;
  overflow: hidden;
  text-decoration: none;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 12px 35px rgba(0,0,0,0.8);
  transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.35s ease, box-shadow 0.35s ease;
}

.game-card.tl {
  background-image: radial-gradient(circle at center, rgba(30,10,50,0.5) 0%, rgba(5,2,15,0.9) 100%), url('fondo-throne.jpg');
}
.game-card.aion {
  background-image: radial-gradient(circle at center, rgba(0,35,55,0.5) 0%, rgba(2,10,20,0.9) 100%), url('fondo-aion.jpg');
}

.tl { --accent-color: var(--neon-purple); --glow-color: rgba(176,38,255,0.4); }
.aion { --accent-color: var(--neon-cyan); --glow-color: rgba(0,243,255,0.4); }

.game-card::before {
  content: "";
  position: absolute;
  top: -100%;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(to bottom, transparent, var(--glow-color), transparent);
  transition: top 0.6s ease-in-out;
  pointer-events: none;
  z-index: 2;
}

.game-card::after {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  pointer-events: none;
  z-index: 2;
  transition: border-color 0.3s ease;
}

.game-card:hover {
  transform: translateY(-6px);
  border-color: var(--accent-color);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 25px var(--glow-color);
}

.game-card:hover::before { top: 100%; }
.game-card:hover::after { border-color: rgba(255, 255, 255, 0.3); }

.game-logo{
  position: relative;
  z-index: 4;
  max-height: 110px;
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 6px 15px rgba(0,0,0,0.9));
  transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.game-card:hover .game-logo { transform: scale(1.08); }
.game-card.tl .game-logo{ max-width: 82%; }
.game-card.aion .game-logo{ max-width: 75%; }
</style>
</head>
<body>

<div class="app-container">

  <!-- HEADER SUPERIOR -->
  <header class="top-header">
    <div class="header-left-title">Tu Mundo Tus Aventuras</div>
    <div class="header-right">
      <div id="liveClock" class="live-clock">00:00:00</div>
      <button id="logout" class="user-logout-btn">⏻ CERRAR SESIÓN</button>
    </div>
  </header>

  <!-- MENÚ LATERAL -->
  <aside class="sidebar">
    <ul class="sidebar-menu">
      <li>
        <button class="menu-icon-btn" data-tooltip="JUEGOS">
          <!-- Icono Control de Videojuego -->
          <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        </button>
      </li>
      <li>
        <!-- Icono Discord en la parte inferior de la barra lateral -->
        <a href="https://discord.gg/4rBsFKGZDj" target="_blank" class="menu-icon-btn discord-btn" data-tooltip="DISCORD">
          <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.15c2.62-27.29-4.52-51.2-19.49-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.71,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.44-12.72S96.15,46,96.13,53,91,65.69,84.69,65.69Z"/></svg>
        </a>
      </li>
    </ul>
  </aside>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="main-content">
    <section class="view-section">
      <div class="games-grid">
        <!-- TARJETA 1: THRONE AND LIBERTY -->
        <a href="Throne and Liberty Eventos.html" class="game-card tl">
          <img class="game-logo" src="logo-throne-liberty.png" alt="Throne and Liberty">
        </a>

        <!-- TARJETA 2: AION 2 -->
        <a href="Aion 2 Eventos.html" class="game-card aion">
          <img class="game-logo" src="logo-aion.png" alt="AION 2">
        </a>
      </div>
    </section>
  </main>

</div>

<script>
// Reloj en hora local de Chile
function updateClock() {
  const now = new Date();
  const options = { timeZone: 'America/Santiago', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
  const timeString = new Intl.DateTimeFormat('es-CL', options).format(now);
  document.getElementById('liveClock').textContent = `${timeString} CLST`;
}
setInterval(updateClock, 1000);
updateClock();

// Cerrar sesión
document.getElementById('logout').addEventListener('click', () => {
  sessionStorage.removeItem('eventosAccess');
  window.location.href = 'Index.html';
});
</script>

</body>
</html>
